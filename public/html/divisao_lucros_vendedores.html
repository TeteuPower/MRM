<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saldo de Repasses</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/estoque.css">
    <link rel="stylesheet" href="../css/divisao_lucros_vendedores.css">
    <link rel="stylesheet" href="../css/divisao_lucros_empresa.css">
</head>
<body>
    <div id="nome-administrador" class="usuario-logado"></div>
    <div id="cabecalho"></div>
    <main>
        <div class="container">
            <h2>Saldo dos Vendedores</h2>
            <div class="nomes">
                <div class="nome">Rafael</div>
                <div class="nome">Maithê</div>
            </div>
            <div class="barras">
                <div class="barra barra1">
                    <span class="valor-barra valor-barra1"></span> 
                </div>
                <div class="barra barra2">
                    <span class="valor-barra valor-barra2"></span>
                </div>
            </div>
            <div class="barra-status">Barra de status da repartição dos Lucros</div>
        </div>
        <div class="resumo">
            <h3>Registrar Repasse</h3>
            <p id="resumo"></p>
            <input type="text" id="input-repasse-adm" placeholder="Digite o valor do repasse">
            <label for="select-repasse-adm">Selecione quem está RECEBENDO:</label>
            <select id="select-repasse-adm">
                <option value="2">Maithê</option>
                <option value="3">Rafael</option>
            </select>
            <button id="btn-fazer-repasses-administradores" class="btn-acao verde">Fazer Repasse</button>
        </div>
        <div class="repasses-feitos">
            <h3>Últimos Repasses Feitos entre Vendedores</h3>
            <ul id="lista-repasses-feitos-vendedores">
                 <!-- Últimos repasses feitos serão adicionados aqui -->
            </ul>
        </div>
    </main>

    <script src="../js/funcoes.js"></script>
    <script src="../js/divisao_lucros_vendedores.js"></script>
</body>
</html>
