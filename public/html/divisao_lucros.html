<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divisão dos Lucros</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/divisao_lucros.css">
</head>
<body>
    <div id="nome-administrador" class="usuario-logado"></div>
    <div id="cabecalho"></div>

    <main>
        <section id="divisao-lucros">
            <h2>Divisão dos Lucros</h2>

            <div class="repasses-producao">
                <h3>Repasses Pendentes para Produção</h3>
                <ul id="lista-repasses-producao">
                    <!-- Repasses pendentes para produção serão adicionados aqui -->
                </ul>
            </div>

            <div class="repasses-administradores">
                <h3>Repasses Pendentes entre Administradores</h3>
                <ul id="lista-repasses-administradores">
                    <!-- Repasses pendentes entre administradores serão adicionados aqui -->
                </ul>
            </div>

            <div class="repasses-feitos">
                <h3>Últimos Repasses Feitos</h3>
                <ul id="lista-repasses-feitos">
                    <!-- Últimos repasses feitos serão adicionados aqui -->
                </ul>
            </div>

            <div class="adicionar-repasse">
                <h3>Adicionar Repasse</h3>
                <div class="input-group">
                    <label for="repasse-para">Repasse para:</label>
                    <select id="repasse-para">
                        <option value="">Selecione o Destinatário</option>
                        <option value="Matheus">Matheus (Produtor)</option>
                        <option value="Maithê">Maithê (Administrador)</option>
                        <option value="Rafael">Rafael (Administrador)</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="valor-repasse">Valor:</label>
                    <input type="number" id="valor-repasse" placeholder="Valor do Repasse">
                </div>

                <div class="input-group">
                    <label for="moeda-repasse">Moeda:</label>
                    <select id="moeda-repasse">
                        <option value="real">Real (R$)</option>
                        <option value="dolar">Dólar (US$)</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="vendedor-repasse">Vendedor Responsável:</label>
                    <select id="vendedor-repasse">
                        <option value="">Selecione o Vendedor</option>
                        <!-- Opções de vendedores serão adicionadas aqui -->
                    </select>
                </div>

                <button id="btn-registrar-repasse" class="btn-acao verde">Registrar Repasse</button>
            </div>
        </section>
    </main>

    <script src="../js/funcoes.js"></script>
    <!--<script src="../js/divisao_lucros.js"></script>-->
</body>
</html>
