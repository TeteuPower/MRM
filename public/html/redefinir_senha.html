<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha de Administrador</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/estoque.css">
    <link rel="stylesheet" href="../css/redefinir_senha.css">
</head>
<body>
    <div id="nome-administrador" class="usuario-logado"></div>
    <div id="cabecalho"></div>

    <main>
        <section id="redefinir-senha">
            <h2>Redefinir Senha de Administrador</h2>

            <form id="form-redefinir-senha">
                <div class="input-group">
                    <label for="administrador-id">ID do Administrador:</label>
                    <select id="administrador-id" placeholder="ID do Administrador">
                        <option value="2">Maithê</option>
                        <option value="3">Rafael</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="nova-senha">Nova Senha:</label>
                    <input type="password" id="nova-senha" placeholder="Nova Senha">
                </div>

                <div class="input-group">
                    <label for="confirmar-nova-senha">Confirmar Nova Senha:</label>
                    <input type="password" id="confirmar-nova-senha" placeholder="Confirmar Nova Senha">
                </div>

                <button id="btn-redefinir-senha" class="btn-acao verde">Redefinir Senha</button>
            </form>
        </section>
    </main>

    <script src="../js/funcoes.js"></script>
    <script src="../js/redefinir_senha.js"></script>
</body>
</html>
