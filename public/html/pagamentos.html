<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informar Novo Pagamento de Cliente</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/pagamentos.css">
</head>
<body>
    <div id="nome-administrador" class="usuario-logado"></div>
    <div id="cabecalho"></div>

    <main>
        <section id="pagamentos">
            <h2>Informar Novo Pagamento de Cliente</h2>

            <form id="form-pagamento-cliente">
                <div class="input-group">
                    <label for="cliente-pagamento">Cliente:</label>
                    <select id="cliente-pagamento">
                        <option value="">Selecione o Cliente</option>
                        <!-- Opções de clientes serão adicionadas aqui -->
                    </select>
                </div>

                <div class="input-group">
                    <label for="valor-pagamento">Valor:</label>
                    <input type="number" id="valor-pagamento" placeholder="Valor do Pagamento">
                </div>

                <div class="input-group">
                    <label for="moeda-pagamento">Moeda:</label>
                    <select id="moeda-pagamento">
                        <option value="real">Real (R$)</option>
                        <option value="dolar">Dólar (US$)</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="recebeu-pagamento">Quem está recebendo?</label>
                    <select id="recebeu-pagamento">
                        <option value="">Selecione o vendedor</option>
                        <!-- Opções de vendedores serão adicionadas aqui -->
                    </select>
                </div>

                <button type="submit" class="btn-acao verde">Registrar Pagamento</button>
            </form>
        </section>
    </main>

    <script src="../js/funcoes.js"></script>
    <!--<script src="../js/pagamentos.js"></script>-->
</body>
</html>
