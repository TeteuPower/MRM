<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desligar Servidor</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/estoque.css">
    <link rel="stylesheet" href="../css/desligar_servidor.css">
</head>
<body>
    <div id="nome-administrador" class="usuario-logado"></div>
    <div id="cabecalho"></div>

    <main>
        <section id="desligar-servidor">
            <h2>Desligar Servidor</h2>

            <form id="form-desligar-servidor">
                <div class="input-group">
                    <label for="senha-desligamento">Senha:</label>
                    <input type="password" id="senha-desligamento" placeholder="Senha">
                </div>

                <button id="btn-desligar-servidor" class="btn-acao vermelho">Desligar Servidor</button>
            </form>
        </section>
    </main>

    <script src="../js/funcoes.js"></script>
    <script src="../js/desligar_servidor.js"></script>
</body>
</html>
