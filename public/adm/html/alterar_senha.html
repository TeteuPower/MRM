<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alterar Senha</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/estoque.css">
    <link rel="stylesheet" href="../css/alterar_senha.css">
</head>
<body>
    <div id="nome-administrador" class="usuario-logado"></div>
    <div id="cabecalho"></div>

    <main>
        <section id="alterar-senha">
            <h2>Alterar Senha</h2>

            <form id="form-alterar-senha">
                <div class="input-group">
                    <label for="senha-atual">Senha Atual:</label>
                    <input type="password" id="senha-atual" placeholder="Senha Atual">
                </div>

                <div class="input-group">
                    <label for="nova-senha">Nova Senha:</label>
                    <input type="password" id="nova-senha" placeholder="Nova Senha">
                </div>

                <div class="input-group">
                    <label for="confirmar-nova-senha">Confirmar Nova Senha:</label>
                    <input type="password" id="confirmar-nova-senha" placeholder="Confirmar Nova Senha">
                </div>

                <button id="btn-salvar-nova-senha" class="btn-acao verde">Salvar Alterações</button>
            </form>
        </section>
    </main>

    <script src="../js/funcoes.js"></script>
    <script src="../js/alterar_senha.js"></script>
</body>
</html>
